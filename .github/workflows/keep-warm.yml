# Render's free plan puts the backend to sleep after 15 minutes without traffic, and the first
# request then waits about a minute. This pings the health check every 10 minutes so the AI
# features answer straight away.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl -fsS --max-time 90 https://ceylo.onrender.com/api/health || true
